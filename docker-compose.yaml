name: mart-pocc

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow

  env_file:
    - .env

  environment:
    TZ: Asia/Jakarta
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@postgres:5432/airflow

    PYTHONPATH: /opt/airflow
    SQL_FILE_PATH: /opt/airflow/src/query/REALIZATION.sql
    TRANSFORM_SQL_FILE_PATH: /opt/airflow/src/query/TRANSFORM.sql

  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src:ro
    - ./simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    - airflow_logs:/opt/airflow/logs

  depends_on:
    postgres:
      condition: service_healthy

  restart: unless-stopped

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow

    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U airflow -d airflow
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - airflow db migrate

    restart: "no"

  airflow-api-server:
    <<: *airflow-common

    command: api-server

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common

    command: dag-processor

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  etl:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      TZ: Asia/Jakarta

    env_file:
      - .env

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: "no"

volumes:
  pg_data:
  airflow_logs:
